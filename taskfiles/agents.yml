# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Agent skills are loaded from three sources and symlinked into the active
# agent's home. Today the only supported agent is Claude Code, so the target
# is ~/.claude/skills/ (override with AGENT_HOME/CLAUDE_HOME). As other agents
# adopt the AGENTS.md convention, add their homes here.
#
#   1. agents/skills.json  -- pinned upstream skills, fetched from GitHub
#                             (cached in agents/skills/, gitignored).
#                             Each entry: github_path + sha + optional name.
#   2. agents/skills-tracked/<skill>/ -- skill folders committed to dotfiles.
#                                        Use for personal or shared skills you
#                                        want versioned across machines.
#   3. agents/skills-local/<skill>/ -- skill folders local to this machine
#                                      (gitignored except for .gitkeep). Use
#                                      for experiments or sensitive skills.
#
# Each skill folder MUST contain SKILL.md. If it also contains commands/,
# those are exposed under ~/.claude/commands/<skill> so slash commands
# surface as /<skill>:<cmd>. Skill folder names must be unique across all
# three sources; collisions abort the install.
#
# `install` fetches the pinned skills (grouping by repo+sha so the same repo
# clones once) and symlinks all three sources into ~/.claude/skills/.
# `sync-upstream` diffs each pinned skill against upstream HEAD; with
# `-- --apply`, rewrites every sha in skills.json to upstream HEAD of its repo.

vars:
  SKILLS_SRC: ./agents/skills
  SKILLS_TRACKED: ./agents/skills-tracked
  SKILLS_LOCAL: ./agents/skills-local
  MANIFEST: ./agents/skills.json

tasks:
  install:
    desc: Fetch skills declared in agents/skills.json and symlink into ~/.claude/skills/
    cmds:
      - cmd: |
          set -e
          command -v jq >/dev/null || { echo "jq required (brew install jq)"; exit 1; }
          # Agent home: prefer AGENT_HOME, fall back to CLAUDE_HOME, then the
          # Claude Code default. Claude is the only agent supported for now.
          CLAUDE_HOME="${AGENT_HOME:-${CLAUDE_HOME:-$HOME/.claude}}"

          manifest_hash="$(shasum -a 256 {{.MANIFEST}} | awk '{print $1}')"
          fetched_marker="{{.SKILLS_SRC}}/.fetched-manifest-hash"

          if [ -f "$fetched_marker" ] && [ "$(cat "$fetched_marker")" = "$manifest_hash" ]; then
            echo "skills already fetched for current manifest, skipping fetch"
          else
            echo "fetching skills declared in {{.MANIFEST}}..."
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            mkdir -p "$tmp/repos"
            rm -rf {{.SKILLS_SRC}}
            mkdir -p {{.SKILLS_SRC}}

            # Clone each unique (repo, sha) exactly once.
            jq -r '.skills | map([(.github_path | split("/") | .[0:2] | join("/")), .sha] | @tsv) | unique | .[]' {{.MANIFEST}} \
            | while IFS=$'\t' read -r owner_repo sha; do
                key="$(printf '%s@%s' "$owner_repo" "$sha" | shasum -a 256 | awk '{print $1}' | cut -c1-16)"
                dir="$tmp/repos/$key"
                echo "  cloning $owner_repo @ $sha"
                git clone --quiet "https://github.com/$owner_repo.git" "$dir"
                git -C "$dir" checkout --quiet "$sha"
              done

            # Copy each skill out of its corresponding cloned repo.
            jq -r '.skills[] | [(.name // (.github_path | split("/") | last)), .github_path, .sha] | @tsv' {{.MANIFEST}} \
            | while IFS=$'\t' read -r name github_path sha; do
                owner_repo="$(printf '%s' "$github_path" | cut -d/ -f1,2)"
                path="$(printf '%s' "$github_path" | cut -d/ -f3-)"
                key="$(printf '%s@%s' "$owner_repo" "$sha" | shasum -a 256 | awk '{print $1}' | cut -c1-16)"
                src="$tmp/repos/$key/$path"
                if [ ! -d "$src" ]; then
                  echo "!! missing: $github_path @ $sha (path '$path' not in repo)"
                  exit 1
                fi
                if [ -e "{{.SKILLS_SRC}}/$name" ]; then
                  echo "!! collision: skill name '$name' appears more than once"
                  exit 1
                fi
                cp -R "$src" "{{.SKILLS_SRC}}/$name"
              done

            echo "$manifest_hash" > "$fetched_marker"
          fi

          mkdir -p "$CLAUDE_HOME/skills" "$CLAUDE_HOME/commands"

          # Track skill names linked during THIS run so we can tell a genuine
          # cross-source collision (two sources both ship `foo`) from a stale
          # link left by a previous run or an older source path. The latter is
          # not a collision -- `ln -sfn` simply repoints it -- which keeps the
          # install idempotent even after the source tree is renamed/moved.
          seen_dir="$(mktemp -d)"

          # Symlink each <skill>/ subdirectory from one source root into the
          # agent's skills dir. If the skill ships /commands/, expose those
          # under the agent's commands dir so slash commands surface as
          # /<skill>:<cmd>. Aborts on cross-source name collisions.
          link_skills_from() {
            local src_root="$1" source_label="$2"
            [ -d "$src_root" ] || return 0
            for d in "$src_root"/*/; do
              [ -d "$d" ] || continue
              local name src dst
              name="$(basename "$d")"
              src="$(realpath "$d")"
              dst="$CLAUDE_HOME/skills/$name"

              if [ -e "$seen_dir/$name" ]; then
                echo "!! collision: skill '$name' from $source_label already provided by $(cat "$seen_dir/$name")"
                exit 1
              fi
              if [ -e "$dst" ] && [ ! -L "$dst" ]; then
                echo "!! collision: $dst exists and is not a symlink"
                exit 1
              fi

              ln -sfn "$src" "$dst"
              printf '%s' "$source_label" > "$seen_dir/$name"
              echo "linked: $dst -> $src ($source_label)"

              if [ -d "$src/commands" ]; then
                local cmd_dst="$CLAUDE_HOME/commands/$name"
                if [ -e "$cmd_dst" ] && [ ! -L "$cmd_dst" ]; then
                  echo "!! collision: $cmd_dst exists and is not a symlink"
                  exit 1
                fi
                ln -sfn "$src/commands" "$cmd_dst"
                echo "linked: $cmd_dst -> $src/commands ($source_label)"
              fi
            done
          }

          link_skills_from "{{.SKILLS_SRC}}" "pinned"
          link_skills_from "{{.SKILLS_TRACKED}}" "tracked"
          link_skills_from "{{.SKILLS_LOCAL}}" "local"
          rm -rf "$seen_dir"

          # Statusline script
          if [ -f ./agents/statusline.sh ]; then
            ln -sfn "$(realpath ./agents/statusline.sh)" "$CLAUDE_HOME/statusline.sh"
            echo "linked: $CLAUDE_HOME/statusline.sh -> $(realpath ./agents/statusline.sh)"
          fi
        silent: true

  sync-upstream:
    desc: Diff each pinned skill against upstream HEAD; pass -- --apply to rewrite shas in skills.json
    summary: |
      For every skill in agents/skills.json, fetches upstream HEAD of its repo
      and diffs against the pinned sha. Read-only by default.

      With --apply, rewrites every .sha in agents/skills.json to the upstream
      HEAD of that skill's repo. The next `task agents:install` will re-fetch.
    cmds:
      - cmd: |
          set -e
          command -v jq >/dev/null || { echo "jq required (brew install jq)"; exit 1; }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/heads" "$tmp/pinned"

          apply=0
          for arg in {{.CLI_ARGS}}; do
            if [ "$arg" = "--apply" ]; then apply=1; fi
          done

          # Resolve upstream HEAD per unique repo, cached on disk.
          remote_head() {
            local owner_repo="$1"
            local cache="$tmp/heads/$(echo "$owner_repo" | tr / _)"
            if [ ! -f "$cache" ]; then
              git ls-remote "https://github.com/$owner_repo.git" HEAD | awk '{print $1}' > "$cache"
            fi
            cat "$cache"
          }

          # Materialize a specific (owner_repo, sha) into a tmp dir so we can diff trees.
          materialize() {
            local owner_repo="$1" sha="$2"
            local key="$(printf '%s@%s' "$owner_repo" "$sha" | shasum -a 256 | awk '{print $1}' | cut -c1-16)"
            local dir="$tmp/pinned/$key"
            if [ ! -d "$dir" ]; then
              git clone --quiet "https://github.com/$owner_repo.git" "$dir"
              git -C "$dir" checkout --quiet "$sha"
            fi
            printf '%s' "$dir"
          }

          any_drift=0
          missing_upstream=0
          updates_file="$tmp/updates.tsv"
          : > "$updates_file"

          while IFS=$'\t' read -r name github_path pinned_sha; do
            owner_repo="$(printf '%s' "$github_path" | cut -d/ -f1,2)"
            path="$(printf '%s' "$github_path" | cut -d/ -f3-)"
            head_sha="$(remote_head "$owner_repo")"

            if [ "$head_sha" = "$pinned_sha" ]; then
              echo "== $name ($owner_repo): pinned == HEAD ($pinned_sha)"
              continue
            fi

            pinned_dir="$(materialize "$owner_repo" "$pinned_sha")"
            head_dir="$(materialize "$owner_repo" "$head_sha")"
            pinned_skill="$pinned_dir/$path"
            head_skill="$head_dir/$path"

            if [ ! -d "$head_skill" ]; then
              echo "!! $name: '$path' removed from $owner_repo upstream HEAD"
              missing_upstream=1
              continue
            fi

            if diff -ruN "$pinned_skill" "$head_skill" > /dev/null; then
              echo "~~ $name ($owner_repo): repo HEAD moved but '$path' unchanged"
            else
              echo "## $name ($owner_repo): differs (pinned $pinned_sha -> HEAD $head_sha)"
              diff -ruN "$pinned_skill" "$head_skill" || true
              echo
              any_drift=1
            fi

            printf '%s\t%s\n' "$github_path" "$head_sha" >> "$updates_file"
          done < <(jq -r '.skills[] | [(.name // (.github_path | split("/") | last)), .github_path, .sha] | @tsv' {{.MANIFEST}})

          if [ "$apply" = "1" ] && [ -s "$updates_file" ]; then
            tmpfile="$tmp/manifest.json"
            cp {{.MANIFEST}} "$tmpfile"
            while IFS=$'\t' read -r gp new_sha; do
              [ -z "$gp" ] && continue
              jq --arg gp "$gp" --arg new "$new_sha" \
                '(.skills[] | select(.github_path == $gp) | .sha) = $new' \
                "$tmpfile" > "$tmpfile.next"
              mv "$tmpfile.next" "$tmpfile"
            done < "$updates_file"
            mv "$tmpfile" {{.MANIFEST}}
            echo
            echo "rewrote shas in {{.MANIFEST}} to upstream HEAD for skills that moved"
            echo "run 'task agents:install' to re-fetch and re-symlink"
          elif [ -s "$updates_file" ] || [ "$missing_upstream" = "1" ]; then
            echo
            echo "(re-run with: task agents:sync-upstream -- --apply  to rewrite shas)"
          fi
        silent: true
